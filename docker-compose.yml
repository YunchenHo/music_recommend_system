services:
  db:
    image: mysql:8.0
    container_name: music_mysql
    command: --local-infile=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: 
      context: ./backend
    container_name: music_django
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      # 覆寫 .env：容器內必須用 service 名稱 db，不可沿用本機的 127.0.0.1
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - ./backend:/app  
      - /app/.venv
      - ./recommender/artifacts:/app/recommender_artifacts:ro
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    
  frontend:
    build: 
      context: ./frontend
    container_name: music_react
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app 
      - /app/node_modules

  recommender:
    build:
      context: ./recommender
      dockerfile: Dockerfile
    container_name: music_recommender
    volumes:
      - ./recommender:/app
      - ./data:/app/data
    env_file:
      - .env
    tty: true
    stdin_open: true
    command: bash

volumes:
  db_data: