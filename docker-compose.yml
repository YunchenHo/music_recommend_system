services:
  backend:
    build:
      context: ./backend
    container_name: music_django
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./recommender/artifacts:/app/recommender_artifacts:ro
      - ./data:/app/data:ro
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py import_kkbox_data &&
             uv run python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: music_react
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  recommender:
    build:
      context: ./recommender
      dockerfile: Dockerfile
    container_name: music_recommender
    volumes:
      - ./recommender:/app
      - ./data:/app/data
    env_file:
      - .env
    tty: true
    stdin_open: true
    command: bash
