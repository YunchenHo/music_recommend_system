[project]
name = "music-recommend-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faiss-cpu>=1.13.2",
    "gdown>=5.2.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "pyarrow>=16.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.18,<2.19",
    "tqdm>=4.67.1",
]

[tool.uv.workspace]
members = [
    "backend",
]

[project.optional-dependencies]
metal = [
    "tensorflow-metal==1.1.*",
]
# LightFM is intentionally NOT listed as a dependency here.
# lightfm 1.17 (last release, 2023) cannot build under Python 3.12 (distutils
# removed) or with modern setuptools (>=70). Install it manually in a
# Python 3.11 venv or Colab:
#   uv venv --python 3.11 .venv-lightfm
#   source .venv-lightfm/bin/activate
#   CFLAGS="-I/opt/homebrew/opt/libomp/include" \
#   LDFLAGS="-L/opt/homebrew/opt/libomp/lib -lomp" \
#   uv pip install lightfm pandas scipy numpy tqdm pyarrow scikit-learn
# Then run stage_14_lightfm_train / stage_15_lightfm_eval inside that venv.
